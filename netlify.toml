# Netlify serves the static site in web/: the web player at /, the landing page at /about/.
# The iPhone app (Backseat/) is built with Xcode and is not part of the site.
[build]
  publish = "web"
  command = "echo 'Static site: no build step'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The player used to live at /app/.
[[redirects]]
  from = "/app"
  to = "/"
  status = 301

[[redirects]]
  from = "/app/"
  to = "/"
  status = 301
